name: ci
on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1 --log-opts="$BASE_SHA..HEAD"

      - name: Block merge-conflict markers
        run: |
          if git grep -nE '^(<{7}|>{7}) ' -- ':!.github/**'; then
            echo "::error::merge conflict markers found"; exit 1
          fi
